name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parcel
          POSTGRES_PASSWORD: parcel
          POSTGRES_DB: parcel
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U parcel"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
        working-directory: api
      - run: make lint
      - run: make pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parcel
          POSTGRES_PASSWORD: parcel
          POSTGRES_DB: parcel
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U parcel"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --locked --no-dev
        working-directory: api
      - run: uv run alembic upgrade head
        working-directory: api
      - run: nohup uv run uvicorn parcel.app:create_app --factory --port 8000 > api.log 2>&1 &
        working-directory: api
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: curl --silent --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/readyz
      - run: pnpm e2e
        working-directory: web
      - run: tail -50 api/api.log
        if: failure()
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/test-results

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
