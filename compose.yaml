services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: parcel
      POSTGRES_PASSWORD: parcel
      POSTGRES_DB: parcel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcel"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
